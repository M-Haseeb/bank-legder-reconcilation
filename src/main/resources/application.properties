spring.application.name=Reconcilation

server.port=8080

# ---------------------------------------------------------------------------
# Datasource (local MySQL). Override with DB_USERNAME / DB_PASSWORD env vars.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bank_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
app.seed.enabled=${APP_SEED_ENABLED:true}
app.security.username=${APP_SECURITY_USERNAME:ledger}
app.security.password=${APP_SECURITY_PASSWORD:ledger123}
app.security.roles=ADMIN,USER
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

info.app.name=Bank Ledger Reconciliation
info.app.description=Ledger and bank statement reconciliation service
info.app.version=0.0.1-SNAPSHOT