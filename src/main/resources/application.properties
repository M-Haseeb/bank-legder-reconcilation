spring.application.name=Reconcilation

# Optional untracked file for local secrets (see application-local.properties in .gitignore).
spring.config.import=optional:file:./application-local.properties

server.port=8080

# ---------------------------------------------------------------------------
# Datasource (local MySQL). Credentials are never committed: provide
# DB_USERNAME / DB_PASSWORD as environment variables, or set
# spring.datasource.username / password in application-local.properties.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bank_ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
app.seed.enabled=${APP_SEED_ENABLED:true}
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---------------------------------------------------------------------------
# Authentication / JWT
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.issuer=${APP_JWT_ISSUER:bank-ledger}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

# The primary administrator comes from environment variables. Additional users
# (roles: ADMIN, ACCOUNTANT, AUDITOR) can be declared here or in the untracked
# application-local.properties, e.g.:
#   app.security.users[0].username=...
#   app.security.users[0].password=...
#   app.security.users[0].roles=ACCOUNTANT
app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:${APP_SECURITY_USERNAME:}}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:${APP_SECURITY_PASSWORD:}}

# ---------------------------------------------------------------------------
# Rate limiting (in-memory, per application instance)
# ---------------------------------------------------------------------------
app.rate-limit.login.capacity=${APP_RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.period=PT1M
app.rate-limit.write.capacity=${APP_RATE_LIMIT_WRITE_CAPACITY:60}
app.rate-limit.write.period=PT1M

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

info.app.name=Bank Ledger Reconciliation
info.app.description=Ledger and bank statement reconciliation service
info.app.version=0.0.1-SNAPSHOT