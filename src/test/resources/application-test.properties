spring.datasource.url=jdbc:h2:mem:reconciliation_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.seed.enabled=false

# Test users (one per role).
app.security.admin.username=admin
app.security.admin.password=admin123
app.security.users[0].username=accountant
app.security.users[0].password=accountant123
app.security.users[0].roles=ACCOUNTANT
app.security.users[1].username=auditor
app.security.users[1].password=auditor123
app.security.users[1].roles=AUDITOR

# Test-only signing key (at least 32 bytes).
app.jwt.secret=test-only-jwt-secret-please-change-0123456789abcdef
app.jwt.issuer=bank-ledger-test
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

# Keep limits high so functional tests do not trip them.
app.rate-limit.login.capacity=1000
app.rate-limit.login.period=PT1M
app.rate-limit.write.capacity=1000
app.rate-limit.write.period=PT1M

app.cors.allowed-origins=http://localhost:3000